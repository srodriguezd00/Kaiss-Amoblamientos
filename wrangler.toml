# Configuracion del Worker del simulador.
#
# Sin este archivo, Cloudflare mira la raiz del repo, encuentra index.html y
# publica TODO como sitio estatico, borrando el Worker. Aca le decimos cual es
# el archivo que tiene que ejecutar y no declaramos ningun directorio de
# assets, asi el deploy toca solo el Worker y no el sitio de GitHub Pages.

name = "kaiss-simulador"
main = "simulador/worker.js"
compatibility_date = "2026-09-07"

# Variables en texto plano. Van aca y no en el panel para que queden
# versionadas: si manana cambia el modelo, se cambia en este archivo y el
# deploy lo aplica solo.
#
# GEMINI_API_KEY NO va aca: es un secret y se carga desde el panel
# (Settings -> Variables and Secrets). Los secrets sobreviven a los deploys.
[vars]
ORIGENES = "https://srodriguezd00.github.io,http://localhost:8000,http://127.0.0.1:8000"

# Precio por imagen a 1K, para cuando haya que revisarlo:
#
#   gemini-3.1-flash-lite-image   0.0336  Lite  <-- el que usamos
#   gemini-2.5-flash-image        0.039   Nano Banana 1
#   gemini-3.1-flash-image        0.067   Nano Banana 2
#   gemini-3-pro-image            0.134   Pro
#
# Se eligio el Lite despues de probarlo: la doc avisa que no esta optimizado
# para multiples imagenes de referencia, que es justo lo que hace el simulador,
# pero en la practica compone bien y respeta el espacio. No se justifica pagar
# el doble por Nano Banana 2. Si algun dia la calidad no alcanza, subir un
# escalon en esta lista.
MODELO = "gemini-3.1-flash-lite-image"

# Donde se guardan los contadores de uso (4 por IP y 60 por dia, ver worker.js).
# El namespace se crea una vez a mano en el panel: Storage & Databases -> KV.
[[kv_namespaces]]
binding = "LIMITES"
id = "8933c05f516446038d9339b0c82eee98"

# Los logs quedan prendidos. Van aca porque lo que se activa a mano en el panel
# lo apaga el deploy siguiente. Son los que muestran el error real de Gemini
# cuando una simulacion falla (el console.error del Worker).
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true
